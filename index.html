<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#6fc3ea" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>もぐら けんせつ めいろ</title>
  </head>
  <body>
    <canvas id="stage" aria-label="もぐら けんせつ めいろ。のりものを ゆびで なぞって たからばこまで すすもう"></canvas>
    <div class="safe-area" aria-hidden="true"></div>
    <button id="sleep" class="sleep" type="button" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5z" />
      </svg>
      おやすみ
    </button>
    <section id="select" class="select" aria-labelledby="select-title">
      <h1 id="select-title" class="select__title">もぐら けんせつ めいろ</h1>
      <p class="select__prompt">どれに のる？</p>
      <div id="vehicles" class="select__list"></div>
    </section>
    <div id="clear" class="clear" hidden>
      <p class="clear__title">やったね！</p>
      <button id="again" class="again" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M20 12a8 8 0 1 1-2.3-5.7" />
          <path d="M20 4v5h-5" />
        </svg>
        もういっかい
      </button>
      <button id="change" class="change" type="button">のりものを えらぶ</button>
    </div>
    <div id="one-more" class="one-more" role="dialog" aria-modal="true" aria-labelledby="one-more-title" hidden>
      <div class="one-more__card">
        <canvas id="one-more-picture" class="one-more__picture" aria-hidden="true"></canvas>
        <p id="one-more-title" class="one-more__title">もぐらさんはつかれました。<br />あといっかいやる？</p>
        <div class="one-more__buttons">
          <button id="one-more-yes" class="again" type="button">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M20 12a8 8 0 1 1-2.3-5.7" />
              <path d="M20 4v5h-5" />
            </svg>
            あと いっかい
          </button>
          <button id="one-more-no" class="one-more__sleep" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5z" />
            </svg>
            おやすみ
          </button>
        </div>
      </div>
    </div>
    <section id="lock" class="lock" aria-labelledby="lock-title" hidden>
      <p id="lock-title" class="lock__title">またあしたね</p>
      <button id="adult" class="lock__adult" type="button">おとなの ひと</button>
      <div id="gate" class="gate" role="dialog" aria-modal="true" aria-labelledby="gate-lead" hidden>
        <p id="gate-lead" class="gate__lead">おとなの ひとへ<br />こたえを いれると、また あそべます</p>
        <p class="gate__question"><span id="gate-question"></span> = <output id="gate-answer" class="gate__answer"></output></p>
        <p id="gate-hint" class="gate__hint" aria-live="polite"></p>
        <div id="gate-keys" class="gate__keys"></div>
        <button id="gate-back" class="gate__back" type="button">もどる</button>
      </div>
    </section>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
